<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Eldorado Brasil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div id="startScreen">

           <img src="background.jpg" class="logo" alt="Logo Eldorado">

            <h1>ELDORADO BRASIL</h1>

            <h2>Comitê de Segurança das Transportadoras</h2>

            <p>

           <input
                type="text"
                id="playerName"
                placeholder="Digite seu nome">
                
           <label for="avatar">
               Escolha seu avatar:
           </label>   

           <select id="avatar">
                <option>🦁 Leão</option>
                <option>🐺 Lobo</option>
                <option>🦅 Águia</option>
                <option>🐯 Tigre</option>
                <option>🦊 Raposa</option>
                <option>🐨 Coala</option>
                <option>🐼 Panda</option>
                <option>🦒 Girafa</option>
                <option>🐘 Elefante</option>
                <option>🦉 Coruja</option>
                <option>🐸 Sapo</option>
                <option>🐢 Tartaruga</option>
                <option>🦜 Arara</option>
                <option>🐬 Golfinho</option>
                <option>🦈 Tubarão</option>
            </select>
                
            <button onclick="startQuiz()">
                Iniciar Quiz
            </button>

            <p class="footer-info">    
                Versão 2026 • Comitê de Segurança • Eldorado Brasil
            </p>  
            
        </div>

        <div id="quizScreen" class="hidden">

            <div class="top-bar">
                <span id="questionNumber"></span>
                <span id="timer">20</span>
            </div>

            <h2 id="question"></h2>

            <div id="answers"></div>

        </div>

        <div id="resultScreen" class="hidden">

            <h1>Fim do Quiz</h1>

            <h2 id="finalScore"></h2>

            <button onclick="location.reload()">
                Reiniciar
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
